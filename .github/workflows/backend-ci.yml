# Author: Trịnh Thiên Quang
# Chạy kiểm thử, đóng gói, kiểm chứng artifact và CDK synth trên GitHub Actions.

name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build-synth:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_EC2_METADATA_DISABLED: 'true'
      PRIMARY_REGION: ap-southeast-1
      SECONDARY_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r ci/requirements.txt
      - run: npm install -g aws-cdk@2
      - run: python -m pytest -q
      - run: python scripts/package_backend.py --with-dependencies
      - run: python scripts/verify_backend_artifacts.py
      - run: python scripts/build_frontend_ci.py
      - run: node --test tests/test_frontend_chat_contract.mjs tests/test_frontend_auth.mjs tests/test_frontend_appsync.mjs
      - run: cdk synth --app "python -m infrastructure.frontend_app" --output dist/web-cdk.out
      - run: cdk synth --app "python -m infrastructure.web_api_app" --output dist/web-api-cdk.out
      - run: cdk synth --app "python -m infrastructure.appsync_app" --output dist/appsync-cdk.out
      - run: cdk synth --app "python infrastructure/app.py" --output dist/foundation.out
      - run: cdk synth --app "python infrastructure/backend_app.py" --output dist/cdk.out
      - run: npx --yes cdk-assets@4.8.0 ls --path dist/cdk.out/SatiBotBackend.assets.json
      - run: python scripts/verify_canary_rollback.py
      - run: |
          mkdir -p dist/deployment
          cp scripts/write_deploy_config.py ci/publish-buildspec.yml dist/deployment/
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: dist/
