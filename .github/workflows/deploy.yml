# Author: Trịnh Thiên Quang
# Đóng gói release, kiểm chứng template Canary/CodePipeline và xuất cấu hình triển khai cho nhánh main.

name: Deploy SatiBot Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_EC2_METADATA_DISABLED: 'true'
      PRIMARY_REGION: ap-southeast-1
      SECONDARY_REGION: us-east-1
      PARAM_ConfigurationReleaseId: ${{ github.sha }}
      PARAM_ConnectionsTableName: SatiBot-AwsConnections
      PARAM_HistoryTableName: SatiBot-ActionHistory
      PARAM_SessionStateTableName: SatiBot-SessionState
      PARAM_PendingActionTableName: SatiBot-PendingAction
      PARAM_FrontendOrigin: https://satibot.id.vn
      PARAM_GrantIntegrationPermissions: 'false'
      PARAM_ChatbotRoleArn: arn:aws:iam::789425597559:role/SatiBot-Chatbot-ExecutionRole
      PARAM_DispatcherRoleArn: arn:aws:iam::789425597559:role/SatiBot-Dispatcher-ExecutionRole
      PARAM_FormatterRoleArn: arn:aws:iam::789425597559:role/SatiBot-Formatter-ExecutionRole
      PARAM_ConnectorRoleArn: arn:aws:iam::789425597559:role/SatiBot-Connector-ExecutionRole
      PARAM_HistoryRoleArn: arn:aws:iam::789425597559:role/SatiBot-History-ExecutionRole
      PARAM_CodeDeployRoleArn: arn:aws:iam::789425597559:role/SatiBot-CodeDeploy-LambdaRole
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r ci/requirements.txt
      - run: npm install -g aws-cdk@2
      - run: python scripts/package_backend.py --with-dependencies
      - run: python scripts/verify_backend_artifacts.py
      - run: python scripts/build_frontend_ci.py
      - run: cdk synth --app "python infrastructure/app.py" --output dist/foundation.out
      - run: cdk synth --app "python infrastructure/backend_app.py" --output dist/cdk.out
      - run: cdk synth --app "python -m infrastructure.web_api_app" --output dist/web-api-cdk.out
      - run: cdk synth --app "python -m infrastructure.appsync_app" --output dist/appsync-cdk.out
      - run: cdk synth --app "python -m infrastructure.frontend_app" --output dist/web-cdk.out
      - run: python scripts/verify_canary_rollback.py
      - run: |
          mkdir -p dist/deployment
          python scripts/write_deploy_config.py \
            --template dist/cdk.out/SatiBotBackend.template.json \
            --output dist/deployment/template-configuration.json
          cp scripts/write_deploy_config.py ci/publish-buildspec.yml ci/pipeline.template.json dist/deployment/
      - uses: actions/upload-artifact@v4
        with:
          name: release-deployment-bundle
          path: dist/deployment/
