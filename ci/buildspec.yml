# Author: Trịnh Thiên Quang
# Cấu hình các bước kiểm thử và build backend trong AWS CodeBuild.

version: 0.2
phases:
  install:
    runtime-versions:
      python: '3.12'
      nodejs: '22'
    commands:
      - python -m pip install -r ci/requirements.txt
      - npm install -g aws-cdk@2
  build:
    commands:
      - python -m pytest -q
      - python scripts/package_backend.py --with-dependencies
      - python scripts/verify_backend_artifacts.py
      - python scripts/build_frontend_ci.py
      - node --test tests/test_frontend_chat_contract.mjs tests/test_frontend_auth.mjs tests/test_frontend_appsync.mjs
      - cdk synth --app "python -m infrastructure.frontend_app" --output dist/web-cdk.out
      - cdk synth --app "python -m infrastructure.web_api_app" --output dist/web-api-cdk.out
      - cdk synth --app "python -m infrastructure.appsync_app" --output dist/appsync-cdk.out
      - cdk synth --app "python infrastructure/app.py" --output dist/foundation.out
      - cdk synth --app "python infrastructure/backend_app.py" --output dist/cdk.out
      - npx --yes cdk-assets@4.8.0 ls --path dist/cdk.out/SatiBotBackend.assets.json
      - python scripts/verify_canary_rollback.py
      - mkdir -p dist/deployment
      - cp scripts/write_deploy_config.py ci/publish-buildspec.yml dist/deployment/
artifacts:
  base-directory: dist
  files:
    - '**/*'
